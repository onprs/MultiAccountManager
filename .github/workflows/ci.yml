name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: account_vault
          POSTGRES_USER: account_vault
          POSTGRES_PASSWORD: local-e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account_vault -d account_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Prepare isolated Passkey runtime
        shell: bash
        run: |
          mkdir -p .runtime-passkey
          printf '%s' 'e2e-setup-token' > .runtime-passkey/account-vault-setup-token
          node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))" > .runtime-passkey/account-vault-config-key
      - name: Passkey registration and login E2E
        run: pnpm test:e2e:passkey
        env:
          RUN_PASSKEY_E2E: "1"
          E2E_SETUP_TOKEN: e2e-setup-token
          E2E_DATABASE_PASSWORD: local-e2e-only
          RUNTIME_CONFIG_DIR: ${{ github.workspace }}/.runtime-passkey
          SETUP_TOKEN_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-setup-token
          CONFIG_MASTER_KEY_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-config-key
      - run: pnpm build
      - run: pnpm audit --audit-level high --registry=https://registry.npmjs.org
