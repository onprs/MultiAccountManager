name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: account_vault
          POSTGRES_USER: account_vault
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account_vault -d account_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Prepare isolated Passkey runtime
        shell: bash
        run: |
          mkdir -p .runtime-passkey
          setup_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$setup_token"
          printf '%s' "$setup_token" > .runtime-passkey/account-vault-setup-token
          printf 'E2E_SETUP_TOKEN=%s\n' "$setup_token" >> "$GITHUB_ENV"
          node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))" > .runtime-passkey/account-vault-config-key
          chmod 0600 .runtime-passkey/account-vault-setup-token .runtime-passkey/account-vault-config-key
      - name: Passkey registration and login E2E
        run: pnpm test:e2e:passkey
        env:
          RUN_PASSKEY_E2E: "1"
          E2E_DATABASE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          RUNTIME_CONFIG_DIR: ${{ github.workspace }}/.runtime-passkey
          SETUP_TOKEN_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-setup-token
          CONFIG_MASTER_KEY_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-config-key
      - run: pnpm build
      - name: Built Worker runtime and graceful shutdown smoke
        run: pnpm test:worker-runtime
        env:
          RUNTIME_CONFIG_DIR: ${{ github.workspace }}/.runtime-passkey
          SETUP_TOKEN_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-setup-token
          CONFIG_MASTER_KEY_FILE: ${{ github.workspace }}/.runtime-passkey/account-vault-config-key
      - run: pnpm audit --audit-level high --registry=https://registry.npmjs.org
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
